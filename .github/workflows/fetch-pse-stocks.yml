name: Fetch PSE Stock Prices

on:
  schedule:
    - cron: '0,30 1,2,3,4,5,6,7 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch@2

      - name: Fetch PSE stock data
        run: node scripts/fetch-pse.js

      - name: Commit updated stock data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/pse-stocks.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update PSE prices $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
